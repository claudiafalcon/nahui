<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <style>.t{font-family:'Inter','Segoe UI',Arial,sans-serif;font-size:24px;fill:#2D2D2D}</style>
  <!-- Tezontle blocks -->
  <rect x="40" y="40" width="260" height="260" rx="12" fill="#D94C3A"/><text class="t" x="50" y="320">Red Tezontle #D94C3A</text>
  <rect x="40" y="360" width="260" height="260" rx="12" fill="#F2887C"/><text class="t" x="50" y="640">Secondary #F2887C</text>
  <rect x="320" y="360" width="260" height="260" rx="12" fill="#A72C2C"/><text class="t" x="330" y="640">Tezontle Dark #A72C2C</text>
  <!-- Neutrals -->
  <rect x="320" y="40" width="260" height="260" rx="12" fill="#F4F4F4"/><text class="t" x="330" y="320">Balanced #F4F4F4</text>
  <rect x="600" y="40" width="260" height="260" rx="12" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="1"/><text class="t" x="610" y="320">White #FFFFFF</text>
  <rect x="600" y="360" width="260" height="260" rx="12" fill="#2D2D2D"/><text class="t" x="610" y="640">Obsidian #2D2D2D</text>
  <!-- Blues -->
  <rect x="880" y="40" width="320" height="260" rx="12" fill="#4A90E2"/><text class="t" x="890" y="320">Primary Blue #4A90E2</text>
  <rect x="880" y="360" width="320" height="260" rx="12" fill="#1E3A8A"/><text class="t" x="890" y="640">Primary (Dark) #1E3A8A</text>
</svg>