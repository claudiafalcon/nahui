# Supabase CLI project configuration — standard structure, so this folder
# is linkable (`supabase link --project-ref <ref>`) the moment a real
# Supabase project exists (see supabase/README.md's checklist).
# Real project created 2026-09-11 (Product Owner).
project_id = "exvzsfnwogmyxfmaffxn"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

# Edge Functions run on Deno, not Node — no [functions] block needed for
# the CLI to discover supabase/functions/<name>/index.ts; each function
# directory name is its own route (…/functions/v1/<name>).

[auth]
# Supabase's own email/password auth is not used by Nahui (business-decisions.md
# Q14 — phone + WhatsApp OTP instead, `send-otp`/`verify-otp` below implement
# it directly against Twilio, not through Supabase's built-in phone-auth
# provider). Left at CLI defaults; disabled features are simply unused, not
# actively turned off, since nothing in this project depends on this section.
enabled = true
port = 54324
